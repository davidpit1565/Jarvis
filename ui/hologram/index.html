<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #030507; overflow: hidden;
    font-family: "SF Mono", "JetBrains Mono", "Courier New", monospace;
  }
  #stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 38%, rgba(24,52,66,0.55) 0%, rgba(3,5,7,0.0) 55%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.9) 0%, #030507 70%),
      #030507;
  }
  canvas#gl { position: absolute; inset: 0; display: block; z-index: 1; }
  canvas#matrix-bg { position: absolute; inset: 0; display: block; z-index: 0; opacity: 0.5; }

  /* Server-room depth cues behind the head: blurred vertical light strips
     standing in for distant rack columns, plus a couple of stray blinking
     LED dots — cheap (pure CSS, no geometry) but breaks up the previously
     flat gradient background so the scene reads as a room, not a void. */
  .rack-strip {
    position: fixed; top: 0; bottom: 0; width: 3px; z-index: 0;
    background: linear-gradient(180deg, transparent, rgba(90,170,190,0.35) 35%, rgba(90,170,190,0.35) 65%, transparent);
    filter: blur(2px); opacity: 0.5;
  }
  .rack-strip.dim { opacity: 0.28; filter: blur(3px); }
  .rack-led {
    position: fixed; width: 4px; height: 4px; border-radius: 50%; z-index: 0;
    background: #7fe0c8; box-shadow: 0 0 6px 1px #7fe0c8; opacity: 0.7;
    animation: led-blink 2.4s ease-in-out infinite;
  }
  .rack-led.amber { background: #ffb15c; box-shadow: 0 0 6px 1px #ffb15c; animation-duration: 3.6s; }
  @keyframes led-blink { 0%,100% { opacity: 0.85; } 50% { opacity: 0.15; } }
  @media (prefers-reduced-motion: reduce) {
    .rack-led { animation: none; opacity: 0.5; }
  }

  /* subtle CRT scanlines + vignette, purely decorative */
  #scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.028) 0px, rgba(255,255,255,0.028) 1px,
      transparent 1px, transparent 3px
    );
    mix-blend-mode: overlay;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    box-shadow: inset 0 0 18vw 4vw rgba(0,0,0,0.85);
  }

  .panel {
    position: fixed; top: 12%; width: min(23vw, 300px);
    color: #6fd8e8; font-size: 11px; line-height: 1.55;
    letter-spacing: 0.3px; z-index: 4; user-select: none;
    text-shadow: 0 0 6px rgba(111,216,232,0.55);
  }
  .panel.left { left: 4%; text-align: left; }
  .panel.right { right: 4%; text-align: right; }
  .panel .heading {
    color: #a8f2ff; font-size: 10px; letter-spacing: 3px;
    opacity: 0.85; margin-bottom: 10px; border-bottom: 1px solid rgba(111,216,232,0.25);
    padding-bottom: 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  .panel .heading .status { font-size: 8.5px; letter-spacing: 1px; opacity: 0.9; white-space: nowrap; }
  .panel .heading .status.live { color: #8bffb0; }
  .panel .heading .status.demo { color: #ffcf7f; }
  .panel .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
  .panel .row .val { color: #ffd9a0; }
  .panel .bar {
    display: inline-block; width: 70px; height: 4px; margin-inline: 6px;
    background: rgba(111,216,232,0.15); vertical-align: middle; position: relative;
  }
  .panel.right .bar { width: 60px; }
  .panel .bar > span {
    position: absolute; inset: 0; background: #6fd8e8; transform-origin: left;
    box-shadow: 0 0 6px #6fd8e8;
  }
  .panel.right .bar > span { transform-origin: right; right: 0; left: auto; }

  #cursor { display: inline-block; width: 6px; height: 11px; background: #6fd8e8; margin-left: 2px; animation: blink 1s steps(1) infinite; vertical-align: -1px; }
  @keyframes blink { 50% { opacity: 0; } }

  #hud-title {
    position: fixed; top: 4%; left: 50%; transform: translateX(-50%);
    z-index: 4; color: #a8f2ff; font-size: 11px; letter-spacing: 6px;
    opacity: 0.75; text-shadow: 0 0 8px rgba(111,216,232,0.6);
    user-select: none;
  }

  #plinth-wrap {
    position: fixed; left: 50%; bottom: 7%; transform: translateX(-50%);
    z-index: 4; text-align: center; user-select: none;
  }
  #plinth-glow {
    width: min(46vw, 560px); height: 6px; margin: 0 auto 14px;
    background: linear-gradient(90deg, transparent, #6fd8e8, #a8f2ff, #6fd8e8, transparent);
    box-shadow: 0 0 24px 4px rgba(111,216,232,0.55);
    border-radius: 3px;
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  #jarvis-label {
    color: #cdf4ff; font-size: 22px; letter-spacing: 14px; font-weight: 600;
    text-shadow: 0 0 14px rgba(111,216,232,0.8), 0 0 40px rgba(111,216,232,0.35);
  }
  #jarvis-sub {
    margin-top: 6px; color: #6fa9b8; font-size: 9px; letter-spacing: 4px; opacity: 0.7;
  }

  /* Respect the OS-level reduced-motion preference: keep every visual
     element (nothing here is functional-only) but stop continuous motion
     — the CSS pulse/blink animations, and (via JS below, since idle
     drift/rotation/glitch bursts are driven from the render loop, not
     CSS) the equivalent JS-driven motion. */
  @media (prefers-reduced-motion: reduce) {
    #plinth-glow, #cursor { animation: none; }
  }

  /* Narrow/phone layout: the desktop side panels + wide activity heading
     don't fit — shrink panels, drop the bar meters (the number alone
     still reads fine at this size), and stack the activity header. */
  @media (max-width: 600px) {
    #hud-title { font-size: 9px; letter-spacing: 3px; width: 90%; }
    .panel { width: 42vw; font-size: 9px; }
    .panel .bar { display: none; }
    .panel .row { white-space: normal; }
    .panel .row .val { margin-left: 5px; }
    #activity { bottom: 17%; font-size: 9px; }
    #activity .heading { flex-direction: column; align-items: flex-start; gap: 2px; }
    #jarvis-label { font-size: 16px; letter-spacing: 8px; }
    #audio-ctl { font-size: 8px; padding: 5px 8px; }
  }

  #glitch-banner {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
    z-index: 6; background: rgba(10, 4, 4, 0.55); border: 1px solid rgba(255,120,90,0.55);
    color: #ffb2a0; padding: 14px 22px; font-size: 12px; letter-spacing: 2px;
    text-align: center; opacity: 0; pointer-events: none;
    text-shadow: 0 0 8px rgba(255,90,60,0.7);
  }
  #glitch-banner .l1 { font-size: 10px; opacity: 0.85; }
  #glitch-banner .l2 { font-size: 15px; font-weight: 700; margin: 4px 0; }
  #glitch-banner .l3 { font-size: 9px; opacity: 0.7; }

  #rgb-split { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; mix-blend-mode: screen; }

  #activity {
    position: fixed; left: 4%; right: 4%; bottom: 20%;
    max-height: 15vh; overflow: hidden; z-index: 4;
    font-size: 10.5px; line-height: 1.6; color: #7fe0c8;
    background: linear-gradient(180deg, rgba(6,14,16,0.0), rgba(6,14,16,0.35));
    border-top: 1px solid rgba(127,224,200,0.18);
    padding-top: 6px; user-select: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 85%, transparent);
    mask-image: linear-gradient(to bottom, transparent, black 30%, black 85%, transparent);
  }
  #activity .heading {
    color: #a8f2ff; font-size: 10px; letter-spacing: 3px; opacity: 0.8;
    display: flex; justify-content: space-between;
  }
  #activity .heading .status { font-size: 9px; letter-spacing: 1px; }
  #activity .heading .status.live { color: #8bffb0; }
  #activity .heading .status.demo { color: #ffcf7f; }
  #activity-lines { margin-top: 4px; }
  #activity-lines .line { opacity: 0.9; white-space: pre; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 5px rgba(127,224,200,0.4); }
  #activity-lines .line .t { opacity: 0.55; }
  #activity-lines .line .k-tool { color: #ffd9a0; }
  #activity-lines .line .k-brain { color: #9fd8ff; }
  #activity-lines .line .k-perm { color: #d3a8ff; }
  #activity-lines .line .k-device { color: #8bffb0; }

  #audio-ctl {
    position: fixed; right: 4%; bottom: 3%; z-index: 6;
    font-size: 9px; letter-spacing: 1.5px; color: #6fd8e8; opacity: 0.55;
    background: rgba(10,18,20,0.4); border: 1px solid rgba(111,216,232,0.3);
    padding: 6px 10px; border-radius: 3px; cursor: pointer; user-select: none;
    transition: opacity 0.2s ease;
  }
  #audio-ctl:hover { opacity: 1; }
  #audio-ctl.active { color: #8bffb0; border-color: rgba(139,255,176,0.5); opacity: 0.9; }

  #face-ctl {
    position: fixed; right: 4%; bottom: 6.6%; z-index: 6;
    font-size: 9px; letter-spacing: 1.5px; color: #6fd8e8; opacity: 0.55;
    background: rgba(10,18,20,0.4); border: 1px solid rgba(111,216,232,0.3);
    padding: 6px 10px; border-radius: 3px; cursor: pointer; user-select: none;
    transition: opacity 0.2s ease;
  }
  #face-ctl:hover { opacity: 1; }
  #face-ctl.active { color: #8bffb0; border-color: rgba(139,255,176,0.5); opacity: 0.9; }
  #face-ctl.loading { color: #ffcf7f; border-color: rgba(255,207,127,0.5); opacity: 0.9; }

  /* WhatsApp-voice-message-style bars: a small canvas beside the plinth
     that only ever draws real analyser data (mic today, TTS once Core
     has it) — flat/idle when nothing is connected, never fake motion. */
  #voice-bars {
    position: fixed; left: 50%; bottom: 13.5%; transform: translateX(-50%);
    z-index: 4; width: 220px; height: 34px; pointer-events: none;
    opacity: 0.85;
  }


  #voice-ring {
    position: fixed; left: 50%; top: 50%; z-index: 2; pointer-events: none;
    width: 340px; height: 340px; margin: -170px 0 0 -170px;
    border-radius: 50%; border: 1px solid rgba(111,216,232,0.0);
    transition: border-color 0.15s ease;
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="matrix-bg"></canvas>
    <div class="rack-strip" style="left:6%"></div>
    <div class="rack-strip dim" style="left:12%"></div>
    <div class="rack-strip dim" style="right:14%"></div>
    <div class="rack-strip" style="right:7%"></div>
    <div class="rack-led" style="left:8%; top:22%"></div>
    <div class="rack-led amber" style="left:13%; top:61%"></div>
    <div class="rack-led" style="right:9%; top:34%"></div>
    <div class="rack-led amber" style="right:15%; top:70%"></div>
    <canvas id="gl"></canvas>
  </div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="rgb-split"></div>

  <div id="hud-title">J . A . R . V . I . S &nbsp; — &nbsp; CORE INTERFACE</div>

  <div class="panel left" id="panel-left">
    <div class="heading">SYSTEM STATUS <span class="status demo" id="status-indicator-left">NO DATA</span></div>
    <div class="rows" id="panel-left-rows"></div>
  </div>

  <div class="panel right" id="panel-right">
    <div class="heading">CORE STATUS <span class="status demo" id="status-indicator-right">NO DATA</span></div>
    <div class="rows" id="panel-right-rows"></div>
  </div>

  <div id="glitch-banner">
    <div class="l1">ENERGY RESERVES CRITICAL</div>
    <div class="l2">HUNGER PROTOCOL INITIATED</div>
    <div class="l3">SYSTEM DEMAND: BIO-FUEL</div>
  </div>

  <div id="voice-ring"></div>

  <div id="activity">
    <div class="heading">
      <span>CORE ACTIVITY — behind the scenes</span>
      <span class="status demo" id="activity-status">DEMO · CORE OFFLINE</span>
    </div>
    <div id="activity-lines"></div>
  </div>

  <canvas id="voice-bars"></canvas>
  <video id="face-cam" playsinline muted style="display:none"></video>
  <div id="audio-ctl">🎙 CONNECT MIC</div>
  <div id="face-ctl">👁 ENABLE FACE TRACKING</div>

  <div id="plinth-wrap">
    <div id="plinth-glow"></div>
    <div id="jarvis-label">JARVIS</div>
    <div id="jarvis-sub">PERSONAL AI &nbsp;·&nbsp; CORE ONLINE</div>
  </div>

<script src="./three.min.js"></script>
<script>
(function () {
  "use strict";

  const REDUCED_MOTION_MQ = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------------------------------------------------------
   * 0. Matrix-style falling code column background — cheap 2D canvas
   *    effect (no WebGL cost) that gives the scene depth behind the
   *    head, echoing the reference video's data-stream backdrop. Frozen
   *    on a single static frame under prefers-reduced-motion instead of
   *    animating forever.
   * ------------------------------------------------------------- */
  (function matrixRain() {
    const mc = document.getElementById("matrix-bg");
    const mctx = mc.getContext("2d");
    const CHARS = "01アイウエオカキクケコJARVISΣΩΔ";
    let cols, drops;

    function resize() {
      mc.width = window.innerWidth;
      mc.height = window.innerHeight;
      cols = Math.floor(mc.width / 16);
      drops = new Array(cols).fill(0).map(() => Math.random() * -40);
    }
    resize();
    window.addEventListener("resize", resize);

    function drawFrame() {
      mctx.fillStyle = "rgba(3,5,7,0.16)";
      mctx.fillRect(0, 0, mc.width, mc.height);
      mctx.font = "13px monospace";
      for (let i = 0; i < cols; i++) {
        const char = CHARS[Math.floor(Math.random() * CHARS.length)];
        const x = i * 16;
        const y = drops[i] * 16;
        mctx.fillStyle = Math.random() < 0.05 ? "rgba(200,255,240,0.8)" : "rgba(90,180,170,0.45)";
        mctx.fillText(char, x, y);
        if (y > mc.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    if (REDUCED_MOTION_MQ) {
      // Render a handful of frames to a settled state, then stop — depth
      // cue stays visible without a perpetual animation loop.
      for (let i = 0; i < 40; i++) drawFrame();
      return;
    }
    (function loop() { drawFrame(); requestAnimationFrame(loop); })();
  })();

  /* ---------------------------------------------------------------
   * 1. Build a luminance mask of a stylized front-facing face using
   *    plain 2D canvas drawing (no external face model/asset needed).
   *    Bright pixels become hologram particles.
   * ------------------------------------------------------------- */
  function buildFaceMask(size) {
    const c = document.createElement("canvas");
    c.width = size;
    c.height = size;
    const ctx = c.getContext("2d");
    // Leave the canvas fully transparent (its default state) — sampling
    // reads pixel alpha to decide where particles go, so an opaque fill
    // here would make the whole square "visible" instead of just the face.

    const cx = size / 2;
    const cy = size / 2;

    ctx.save();
    ctx.translate(cx, cy);

    // Head silhouette (soft-edged oval, slightly egg-shaped like a face).
    const headGrad = ctx.createRadialGradient(0, -size * 0.02, size * 0.05, 0, 0, size * 0.42);
    headGrad.addColorStop(0, "rgba(255,255,255,0.95)");
    headGrad.addColorStop(0.72, "rgba(255,255,255,0.55)");
    headGrad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    // Proportioned to roughly match the wireframe head's own
    // HEAD_SX/HEAD_SY ratio it gets projected onto further down (an
    // elongated human oval, not a rounder ball) — a mismatch here
    // previously stuck out past the wireframe head's actual crown/chin as
    // a stray particle "spike" when viewed from the side.
    ctx.ellipse(0, 0, size * 0.27, size * 0.36, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = "destination-out";
    // Carve almond-shaped eye sockets (angled, not plain ellipses) with a
    // slight upward outer canthus, like a real eye opening.
    for (const sx of [-1, 1]) {
      ctx.save();
      ctx.translate(sx * size * 0.115, -size * 0.05);
      ctx.rotate(sx * -0.12);
      ctx.beginPath();
      // Smaller still and lightly erased — this is now just a soft
      // under-brow shadow, not a socket outline. The actual "eye" is the
      // small bright 3D sphere sitting on the wireframe surface; a dark
      // almond patch here on top of that read as huge blank alien eyes.
      ctx.ellipse(0, 0, size * 0.04, size * 0.016, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fill();
      ctx.restore();
    }
    // Carve eyebrow shadow (a thin arched band above each eye).
    for (const sx of [-1, 1]) {
      ctx.save();
      ctx.translate(sx * size * 0.115, -size * 0.105);
      ctx.rotate(sx * -0.1);
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.085, size * 0.012, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.fill();
      ctx.restore();
    }
    // Nostril shadows either side of the philtrum.
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(sx * size * 0.028, size * 0.135, size * 0.012, size * 0.009, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      ctx.fill();
    }
    // Carve under the nose / philtrum shadow.
    ctx.beginPath();
    ctx.ellipse(0, size * 0.14, size * 0.05, size * 0.03, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fill();
    // Carve mouth line, and a faint lower-lip shadow just beneath it.
    ctx.beginPath();
    ctx.ellipse(0, size * 0.205, size * 0.075, size * 0.016, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.9)";
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, size * 0.228, size * 0.055, size * 0.014, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fill();
    // Carve cheek hollows (subtle, below/outside the eyes) for jaw definition.
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(sx * size * 0.155, size * 0.06, size * 0.05, size * 0.075, sx * 0.25, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.22)";
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    // Add back soft highlights: brow ridge, nose bridge, upper cheekbones —
    // broad structure only; the fine circuit-like texture on top of this
    // comes from the trace overlay below, not from more painted shapes.
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.beginPath();
    ctx.ellipse(0, -size * 0.01, size * 0.026, size * 0.115, 0, 0, Math.PI * 2);
    ctx.fill();
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(sx * size * 0.15, size * 0.005, size * 0.05, size * 0.06, sx * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.3)";
      ctx.fill();
    }
    // Jaw/chin highlight so the lower face doesn't fade to nothing.
    ctx.beginPath();
    ctx.ellipse(0, size * 0.255, size * 0.09, size * 0.045, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    ctx.fill();

    // --- Circuit-trace overlay: thin branching lines etched across the
    // face, masked to the head silhouette already drawn. This is what
    // reads as "technical/schematic" in the reference stills, rather
    // than a smooth plain bust — drawn procedurally (a random walk per
    // trace), never a fixed decal, so it stays subtle and organic.
    ctx.globalCompositeOperation = "source-atop"; // only draws where the head alpha already is
    ctx.strokeStyle = "rgba(180,255,255,0.35)";
    ctx.lineWidth = Math.max(1, size * 0.0018);
    const rand = (a, b) => a + Math.random() * (b - a);
    for (let t = 0; t < 22; t++) {
      let x = rand(-size * 0.24, size * 0.24);
      let y = rand(-size * 0.32, size * 0.28);
      const steps = Math.floor(rand(3, 7));
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let s = 0; s < steps; s++) {
        x += rand(-size * 0.05, size * 0.05);
        y += rand(-size * 0.045, size * 0.045);
        ctx.lineTo(x, y);
      }
      ctx.globalAlpha = rand(0.15, 0.45);
      ctx.stroke();
      // small "node" dot at the trace's end, like a circuit via.
      ctx.beginPath();
      ctx.arc(x, y, size * 0.004, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(210,255,255,0.5)";
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Faint horizontal scan bands across the whole face (subtle, like a
    // slow depth-scan sweep) — a handful of thin translucent stripes.
    for (let i = 0; i < 14; i++) {
      const yy = -size * 0.34 + (i / 13) * size * 0.62;
      ctx.fillStyle = `rgba(200,255,255,${rand(0.02, 0.06).toFixed(3)})`;
      ctx.fillRect(-size * 0.3, yy, size * 0.6, Math.max(1, size * 0.0015));
    }
    ctx.globalCompositeOperation = "source-over";

    ctx.restore();
    return ctx.getImageData(0, 0, size, size);
  }

  function sampleParticles(imageData, size, targetCount) {
    const positions = [];
    const alphas = [];
    const data = imageData.data;
    const stride = 1; // sampling grid step in source pixels — 1 to resolve fine trace detail
    for (let y = 0; y < size; y += stride) {
      for (let x = 0; x < size; x += stride) {
        const idx = (y * size + x) * 4;
        const a = data[idx + 3] / 255;
        if (a < 0.08) continue;
        if (Math.random() > a * 0.9 + 0.1) continue; // denser sampling where brighter
        positions.push(x, y);
        alphas.push(a);
      }
    }
    // Downsample/upsample lightly toward targetCount by random pick.
    if (positions.length / 2 > targetCount) {
      const keep = new Set();
      while (keep.size < targetCount) keep.add(Math.floor(Math.random() * (positions.length / 2)));
      const p2 = [], a2 = [];
      keep.forEach((i) => { p2.push(positions[i * 2], positions[i * 2 + 1]); a2.push(alphas[i]); });
      return { positions: p2, alphas: a2 };
    }
    return { positions, alphas };
  }

  /* ---------------------------------------------------------------
   * 2. Three.js scene: particle head as THREE.Points, gentle rotation,
   *    occasional glitch pass, colour ramp cyan -> amber by depth/side.
   * ------------------------------------------------------------- */
  const canvas = document.getElementById("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 7.2);

  /* ---------------------------------------------------------------
   * 2a. Manual orbit — drag to inspect the head from any angle (side,
   *     back, above). This moves the CAMERA around a fixed head; it's
   *     deliberately independent of webcam face-tracking (further down),
   *     which instead rotates the HEAD to face the tracked user. The two
   *     are separate controls that can both be in play at once — dragging
   *     the camera to the side while face-tracking is active still lets
   *     the head turn to face wherever your real face is, which is a
   *     different thing from the camera's current viewing angle.
   * ------------------------------------------------------------- */
  let camAzimuth = 0;
  let camElevation = 0;
  let camDistance = 7.2;
  let orbitDragging = false;
  let lastPointerX = 0;
  let lastPointerY = 0;

  function updateCameraFromOrbit() {
    const elev = Math.max(-1.2, Math.min(1.2, camElevation));
    camera.position.set(
      camDistance * Math.sin(camAzimuth) * Math.cos(elev),
      camDistance * Math.sin(elev),
      camDistance * Math.cos(camAzimuth) * Math.cos(elev)
    );
    camera.lookAt(0, 0, 0);
  }
  updateCameraFromOrbit();

  renderer.domElement.style.cursor = "grab";
  renderer.domElement.style.touchAction = "none";
  renderer.domElement.addEventListener("pointerdown", (e) => {
    orbitDragging = true;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    renderer.domElement.style.cursor = "grabbing";
  });
  window.addEventListener("pointermove", (e) => {
    if (!orbitDragging) return;
    camAzimuth += (e.clientX - lastPointerX) * 0.006;
    camElevation += (e.clientY - lastPointerY) * 0.006;
    lastPointerX = e.clientX;
    lastPointerY = e.clientY;
    updateCameraFromOrbit();
  });
  window.addEventListener("pointerup", () => {
    orbitDragging = false;
    renderer.domElement.style.cursor = "grab";
  });
  renderer.domElement.addEventListener("wheel", (e) => {
    camDistance = Math.max(3, Math.min(14, camDistance + e.deltaY * 0.005));
    updateCameraFromOrbit();
    e.preventDefault();
  }, { passive: false });

  // Shared head proportions — used by both the wireframe head (below) and
  // the particle mask projection, so the particle "skin" actually wraps
  // the wireframe's surface instead of floating in front of it as a flat
  // card (which is what made it look like a 2D mask rather than a head
  // when viewed from any angle but straight-on).
  const HEAD_R = 1.62;
  // Taller than wide, like an actual human head/face — a near-circular
  // head (an earlier attempt at "less alien") wasn't the fix; the
  // reference video's head is a clearly elongated oval with a real nose,
  // cheekbones, and a jaw narrower than the crown.
  const HEAD_SX = 0.7; // width
  const HEAD_SY = 0.94; // height
  const HEAD_SZ = 0.86; // depth — a bit deeper to leave room for the nose

  const MASK_SIZE = 340;
  const mask = buildFaceMask(MASK_SIZE);
  // Reduced from 26000: with real facial contour lines now drawn
  // explicitly (eyes, brows, nose, cheeks — see buildFace() below), a
  // dense particle shimmer on top was visual noise competing with them
  // rather than supporting texture.
  const { positions: rawPos, alphas } = sampleParticles(mask, MASK_SIZE, 15000);
  const count = alphas.length;

  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  const cyan = new THREE.Color(0x6fd8e8);
  const brightCyan = new THREE.Color(0xbdf3ff);
  const amber = new THREE.Color(0xffb15c);

  // Scaled so the mask's own head-silhouette radius (size*0.27 in
  // buildFaceMask) lines up with the wireframe head's real half-width —
  // otherwise the particle "face" renders far larger than the wireframe
  // it's supposed to sit on.
  const scale = (HEAD_R * HEAD_SX) / (MASK_SIZE * 0.27);
  const rx = HEAD_R * HEAD_SX, ry = HEAD_R * HEAD_SY, rz = HEAD_R * HEAD_SZ;
  for (let i = 0; i < count; i++) {
    const px = rawPos[i * 2];
    const py = rawPos[i * 2 + 1];
    const x = (px - MASK_SIZE / 2) * scale;
    const y = -(py - MASK_SIZE / 2) * scale;
    // Project onto the front surface of the same ellipsoid the wireframe
    // head is built from, instead of a flat plane with random jitter —
    // this is what lets the particle layer actually follow the head's
    // curvature (and disappear correctly toward the silhouette edge)
    // rather than reading as a flat card floating in front of it.
    const nx = x / rx, nyv = y / ry;
    const under = 1 - nx * nx - nyv * nyv;
    if (under <= 0) {
      // Outside the head ellipsoid's footprint at this height/width —
      // skip it (leave size at its default 0, so it never renders)
      // instead of collapsing it onto a flat z=0 plane, which is what
      // produced a stray particle "spike" poking out past the crown/chin
      // when viewed from the side.
      continue;
    }
    const zSurf = rz * Math.sqrt(under);
    const z = zSurf + (Math.random() - 0.5) * 0.08;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;

    // Colour: mostly cyan hologram, warm amber rim on the right-facing edge,
    // brighter core near the vertical midline (echoes the reference stills).
    const rim = Math.max(0, x / rx);
    const core = Math.max(0, 1 - Math.abs(x) / (rx * 0.45));
    const col = cyan.clone().lerp(amber, rim * 0.5).lerp(brightCyan, core * 0.5 * Math.random());
    const flick = 0.75 + Math.random() * 0.25;
    colors[i * 3] = col.r * flick;
    colors[i * 3 + 1] = col.g * flick;
    colors[i * 3 + 2] = col.b * flick;

    sizes[i] = (0.02 + Math.random() * 0.022) * (0.6 + alphas[i]);
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));

  // Soft round sprite so points read as glowing dots, not hard squares.
  const spriteCanvas = document.createElement("canvas");
  spriteCanvas.width = spriteCanvas.height = 32;
  const sctx = spriteCanvas.getContext("2d");
  const grad = sctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.4, "rgba(255,255,255,0.7)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  sctx.fillStyle = grad;
  sctx.fillRect(0, 0, 32, 32);
  const spriteTex = new THREE.CanvasTexture(spriteCanvas);

  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTexture: { value: spriteTex },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) },
      uTime: { value: 0 },
      uGlitch: { value: 0 },
      uAudio: { value: 0 },
      uReducedMotion: { value: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 0 },
    },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      uniform float uPixelRatio;
      uniform float uTime;
      uniform float uGlitch;
      uniform float uAudio;
      uniform float uReducedMotion;
      void main() {
        vColor = color;
        vec3 p = position;
        // gentle idle drift so the hologram never looks static — skipped
        // under prefers-reduced-motion (uReducedMotion == 1.0)
        float motion = 1.0 - uReducedMotion;
        p.x += sin(uTime * 0.6 + position.y * 3.0) * 0.006 * motion;
        p.y += cos(uTime * 0.5 + position.x * 3.0) * 0.006 * motion;
        p.x += uGlitch * (sin(position.y * 40.0 + uTime * 30.0)) * 0.12 * motion;
        // voice-reactive: outward breathing pulse driven by live audio level,
        // strongest at the mouth/jaw (lower half of the face) so it reads
        // as "speaking" rather than a uniform global pulse
        float lower = clamp(-position.y * 0.6 + 0.5, 0.0, 1.0);
        float pulse = uAudio * lower * (0.6 + 0.4 * sin(uTime * 24.0 + position.x * 6.0));
        p += normalize(position + vec3(0.0001)) * pulse * 0.18;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = aSize * uPixelRatio * (340.0 / -mv.z) * (1.0 + uAudio * 0.5);
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      uniform sampler2D uTexture;
      void main() {
        vec4 tex = texture2D(uTexture, gl_PointCoord);
        if (tex.a < 0.05) discard;
        gl_FragColor = vec4(vColor, tex.a);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geometry, material);

  /* ---------------------------------------------------------------
   * 2b. Wireframe "mesh head" layer. The reference video's head is a
   *     triangulated grid mesh with a bright dot at every vertex, not a
   *     particle-noise cloud — the particle layer above alone can't
   *     reproduce that. This adds the missing structural layer: a
   *     low-poly sphere squashed into a head/oval shape, tapered to a
   *     jaw/chin below the midline, with a brow ridge and nose bump
   *     pushed outward on the front-facing vertices only, rendered as
   *     glowing line edges plus a bright node dot at every vertex
   *     (reusing the same soft sprite texture as the particle layer).
   * ------------------------------------------------------------- */
  /* Latitude/longitude lines only — no diagonal cell splits. The
     reference video's grid is a clean rows-and-columns pattern, not a
     busy triangulated mesh; THREE.WireframeGeometry(sphere) draws every
     triangle edge (including the diagonal that splits each grid cell),
     which reads as visual noise by comparison. Sphere geometry vertices
     are already laid out as (heightSegments+1) rows x (widthSegments+1)
     columns, row-major, so this just connects same-row and same-column
     neighbors directly instead of going through the triangle indices. */
  function buildLatLongWireframe(posAttr, widthSegments, heightSegments) {
    const cols = widthSegments + 1;
    const pts = [];
    const v = new THREE.Vector3();
    const push = (i) => { v.fromBufferAttribute(posAttr, i); pts.push(v.x, v.y, v.z); };
    for (let row = 0; row <= heightSegments; row++) {
      for (let col = 0; col < widthSegments; col++) {
        push(row * cols + col);
        push(row * cols + col + 1);
      }
    }
    for (let col = 0; col <= widthSegments; col++) {
      for (let row = 0; row < heightSegments; row++) {
        push(row * cols + col);
        push((row + 1) * cols + col);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(pts), 3));
    return geo;
  }

  function buildHeadWireframe() {
    const WIDTH_SEGS = 28, HEIGHT_SEGS = 20;
    const sphere = new THREE.SphereGeometry(HEAD_R, WIDTH_SEGS, HEIGHT_SEGS);
    const posAttr = sphere.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < posAttr.count; i++) {
      v.fromBufferAttribute(posAttr, i);
      const ny = v.y / HEAD_R; // -1 (chin) .. 1 (crown)
      let x = v.x * HEAD_SX;
      let z = v.z * HEAD_SZ;
      const y = v.y * HEAD_SY; // shorten overall so it reads as a head, not an egg
      if (ny < -0.05) {
        // Saturate the taper by ny=-0.6 so the lower quarter (jaw+chin)
        // stays at a rounded plateau width instead of narrowing all the
        // way to the sphere's pole — otherwise it reads as a pointed
        // teardrop instead of a jawline.
        const tt = Math.min(1, (-ny - 0.05) / 0.55);
        const eased = tt * tt * (3 - 2 * tt);
        const taper = 1 - eased * 0.4;
        x *= taper;
        z *= taper;
      }
      const front = Math.max(0, z) / HEAD_SZ; // 0..1, 1 = directly facing camera
      const xf = x / (HEAD_R * HEAD_SX); // -1..1, width-relative (scale-independent)
      if (front > 0.5) {
        // Brow ridge.
        const browBand = Math.max(0, 1 - Math.abs(ny - 0.12) / 0.12);
        z += browBand * front * 0.055;

        // Nose: a bridge running from the brow down to the tip, narrow in
        // x, growing stronger toward the tip, plus a small rounder bulb
        // right at the tip and a slight nostril-flare widening just above
        // it — an actual protruding nose instead of one soft general bump.
        const noseXFall = Math.max(0, 1 - Math.abs(xf) / 0.11);
        const bridgeBand = Math.max(0, Math.min(1, (0.1 - ny) / 0.3)); // 0 at brow, 1 at tip
        z += noseXFall * bridgeBand * front * 0.22;
        const tipBand = Math.max(0, 1 - Math.abs(ny + 0.16) / 0.06);
        z += tipBand * noseXFall * front * 0.12;
        const flareXFall = Math.max(0, 1 - Math.abs(Math.abs(xf) - 0.09) / 0.05);
        const flareYBand = Math.max(0, 1 - Math.abs(ny + 0.18) / 0.05);
        z += flareXFall * flareYBand * front * 0.06;

        // Cheekbone ridge, with a slight hollow just below/outside it —
        // the wireframe grid is coarse, but this is enough to break up a
        // perfectly smooth dome into something with real facial contour.
        const cheekXFall = Math.max(0, 1 - Math.abs(Math.abs(xf) - 0.62) / 0.16);
        const cheekYBand = Math.max(0, 1 - Math.abs(ny + 0.08) / 0.14);
        z += cheekXFall * cheekYBand * front * 0.07;
        const hollowXFall = Math.max(0, 1 - Math.abs(Math.abs(xf) - 0.66) / 0.14);
        const hollowYBand = Math.max(0, 1 - Math.abs(ny + 0.3) / 0.13);
        z -= hollowXFall * hollowYBand * front * 0.05;
      }
      posAttr.setXYZ(i, x, y, z);
    }
    posAttr.needsUpdate = true;

    const wireGeo = buildLatLongWireframe(posAttr, WIDTH_SEGS, HEIGHT_SEGS);
    const wireMat = new THREE.LineBasicMaterial({
      color: 0x8fe8f5, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending,
    });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);

    const nodeGeo = new THREE.BufferGeometry();
    nodeGeo.setAttribute("position", posAttr.clone());
    const nodeMat = new THREE.PointsMaterial({
      size: 0.05, map: spriteTex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0xdfffff,
    });
    const nodes = new THREE.Points(nodeGeo, nodeMat);

    const group = new THREE.Group();
    group.add(wireframe, nodes);
    return group;
  }
  const headWire = buildHeadWireframe();

  /* ---------------------------------------------------------------
   * 2b-0. A neck — every reference frame shows the head sitting on a
   *     visible neck/collar, not floating with nothing underneath it.
   *     A short wireframe cone, same material style as the head.
   * ------------------------------------------------------------- */
  function buildNeck() {
    const topR = HEAD_R * HEAD_SX * 0.42;
    const bottomR = HEAD_R * HEAD_SX * 0.36;
    const height = HEAD_R * HEAD_SY * 0.5;
    const topY = -HEAD_R * HEAD_SY * 0.62;
    const cone = new THREE.CylinderGeometry(topR, bottomR, height, 16, 3, true);
    cone.translate(0, topY - height / 2, 0);
    const wireGeo = new THREE.WireframeGeometry(cone);
    const wireMat = new THREE.LineBasicMaterial({
      color: 0x8fe8f5, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending,
    });
    return new THREE.LineSegments(wireGeo, wireMat);
  }
  headWire.add(buildNeck());

  /* ---------------------------------------------------------------
   * 2b-i. Face line art. A uniform grid dome with only subtle vertex
   *     bumps reads as alien/featureless from the front — the reference
   *     video's face is actually drawn with explicit anatomical contour
   *     lines (almond eye outlines, brow arcs, a nose outline, cheek/jaw
   *     lines) with the grid layered on top for texture, not vertex
   *     sculpting alone carrying the likeness. This reproduces that:
   *     each feature is a small `THREE.Line`/`THREE.LineLoop` whose
   *     points are projected onto the same front-surface ellipsoid the
   *     wireframe head itself is built from (so it sits flush on the
   *     surface, not floating in front of it), addressed in xf/yf
   *     fractions of the head's own half-width/half-height so it stays
   *     correct if HEAD_SX/SY/SZ change again.
   * ------------------------------------------------------------- */
  function projectToSurface(xf, yf, lift) {
    const x = xf * rx, y = yf * ry;
    const nx = x / rx, nyv = y / ry;
    const under = Math.max(0, 1 - nx * nx - nyv * nyv);
    const z = rz * Math.sqrt(under) * (lift || 1.03);
    return new THREE.Vector3(x, y, z);
  }
  function buildFaceLine(pointsFrac, opts) {
    opts = opts || {};
    const pts = pointsFrac.map(([xf, yf]) => projectToSurface(xf, yf, opts.lift));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({
      color: opts.color || 0xdfffff, transparent: true,
      opacity: opts.opacity != null ? opts.opacity : 0.75, blending: THREE.AdditiveBlending,
    });
    return opts.loop ? new THREE.LineLoop(geo, mat) : new THREE.Line(geo, mat);
  }

  function buildFace() {
    const group = new THREE.Group();
    const EYE_X = 0.4, EYE_Y = 0.2;

    for (const sx of [-1, 1]) {
      // Eyebrow: a short arc above the eye.
      group.add(buildFaceLine([
        [sx * 0.24, EYE_Y + 0.11], [sx * 0.4, EYE_Y + 0.15], [sx * 0.54, EYE_Y + 0.1],
      ], { opacity: 0.85, color: 0xffffff }));

      // Almond eye outline — the actual "eye" shape, not just a dot.
      const eyePts = [];
      for (let k = 0; k <= 10; k++) {
        const a = (k / 10) * Math.PI * 2;
        eyePts.push([sx * (EYE_X + Math.cos(a) * 0.095), EYE_Y + Math.sin(a) * 0.042]);
      }
      group.add(buildFaceLine(eyePts, { loop: true, opacity: 1, color: 0xffffff, lift: 1.06 }));

      // Nostril flare, connected to the shared nose bridge/tip below.
      group.add(buildFaceLine([
        [0, -0.16], [sx * 0.07, -0.21], [sx * 0.1, -0.14],
      ], { opacity: 0.9, color: 0xffffff, lift: 1.06 }));

      // Cheek -> jaw contour: the face's outer boundary line, from near
      // the temple down past the cheekbone to the chin.
      group.add(buildFaceLine([
        [sx * 0.78, 0.18], [sx * 0.72, -0.1], [sx * 0.6, -0.42],
        [sx * 0.4, -0.68], [sx * 0.15, -0.8],
      ], { opacity: 0.8, color: 0xffffff, lift: 1.05 }));
    }

    // Nose bridge, straight down the center from brow to tip.
    group.add(buildFaceLine([[0, 0.26], [0, 0.05], [0, -0.16]], { opacity: 0.9, color: 0xffffff, lift: 1.06 }));

    // Philtrum: the short shadow line between the nose tip and mouth.
    group.add(buildFaceLine([[0, -0.22], [0, -0.3]], { opacity: 0.5, color: 0xffffff, lift: 1.04 }));

    // Ears — a small closed loop sitting right at the head's silhouette
    // edge (not on the front-facing surface, so this doesn't use
    // projectToSurface: ears stick out sideways past that curve, not
    // flush against it), at roughly eye-to-nose height, matching the
    // reference video's ear position.
    for (const sx of [-1, 1]) {
      const baseX = rx * 0.98;
      const baseY = -0.08 * ry;
      const earZ = rz * 0.1;
      const earPts = [
        [0.02, 0.1], [0.09, 0.08], [0.13, 0.02], [0.11, -0.06],
        [0.05, -0.11], [-0.02, -0.1], [-0.04, -0.03], [-0.02, 0.05],
      ].map(([dx, dy]) => new THREE.Vector3(sx * (baseX + dx * ry), baseY + dy * ry, earZ));
      const earGeo = new THREE.BufferGeometry().setFromPoints(earPts);
      const earMat = new THREE.LineBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending,
      });
      group.add(new THREE.LineLoop(earGeo, earMat));
    }

    // Bright "pupil" glint inside each eye — small emissive sphere seated
    // on the same surface, at the eye's own centre.
    const nx = EYE_X, nyv = EYE_Y;
    const under = Math.max(0, 1 - nx * nx - nyv * nyv);
    const ez = rz * Math.sqrt(under) * 1.06;
    const eyeGeo = new THREE.SphereGeometry(0.032, 12, 12);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xeafcff });
    for (const sx of [-1, 1]) {
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eye.position.set(sx * EYE_X * rx, EYE_Y * ry, ez);
      group.add(eye);
    }

    return group;
  }
  headWire.add(buildFace());

  /* ---------------------------------------------------------------
   * 2b-i-b. A visible "brain" inside the translucent skull — the
   *     wireframe is just line edges, so anything placed inside the
   *     head volume is naturally visible through it. A warm amber cloud
   *     of small particles filling most of the cranium, with a handful
   *     of connecting "synapse" line segments, echoes the reference
   *     video's internal glow rather than leaving the head an empty
   *     shell. Its glow brightens on real brain.request/brain.response
   *     observer events (wired further down, near the activity feed) —
   *     when Core is actually running and thinking, not a fixed pulse.
   * ------------------------------------------------------------- */
  function buildBrain() {
    // Pulled back and shrunk a little further behind the eye/nose/cheek
    // plane than a first pass had it — otherwise the brain particles
    // visually bleed into and bury the face contour lines built above.
    const bx = rx * 0.65, by = ry * 0.5, bz = rz * 0.5;
    const centerY = ry * 0.15;
    const centerZ = -rz * 0.22;
    const n = 900;
    // Base (resting) position per particle, plus a random phase/speed so
    // each one drifts on its own sine cycle — this is what gives the
    // "always thinking, never static" look asked for, rather than a
    // structure that only moves when a real event bumps brainPulse.
    const basePositions = new Float32Array(n * 3);
    const phases = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let x, y, z;
      do {
        x = Math.random() * 2 - 1;
        y = Math.random() * 2 - 1;
        z = Math.random() * 2 - 1;
      } while (x * x + y * y + z * z > 1);
      basePositions[i * 3] = x * bx;
      basePositions[i * 3 + 1] = y * by + centerY;
      basePositions[i * 3 + 2] = z * bz + centerZ;
      phases[i] = Math.random() * Math.PI * 2;
    }
    const positions = basePositions.slice();
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({
      size: 0.065, map: spriteTex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: 0xffb15c, opacity: 0.8,
    });
    const points = new THREE.Points(geo, mat);

    const lineCount = 46;
    const lineEndpoints = new Array(lineCount);
    const linePositions = new Float32Array(lineCount * 2 * 3);
    function rewire(i) {
      const ia = Math.floor(Math.random() * n);
      const ib = Math.floor(Math.random() * n);
      lineEndpoints[i] = [ia, ib];
    }
    for (let i = 0; i < lineCount; i++) rewire(i);
    const lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    const lineMat = new THREE.LineBasicMaterial({
      color: 0xffb15c, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending,
    });
    const lines = new THREE.LineSegments(lineGeo, lineMat);

    const group = new THREE.Group();
    group.add(points, lines);
    return {
      group, pointsMat: points.material, lineMat,
      n, basePositions, phases, posAttr: geo.attributes.position,
      lineEndpoints, lineGeo, rewire,
    };
  }
  const brain = buildBrain();
  headWire.add(brain.group);

  /* ---------------------------------------------------------------
   * 2b-ii. Mouth line — two thin curved lines (upper/lower lip) whose
   *     vertical separation is driven every frame by the real audio
   *     level (the same value that drives the particle pulse below),
   *     so the mouth visibly opens while speech/mic input is loud and
   *     closes to a flat line at silence — genuine lip movement tied to
   *     sound, not a decorative loop.
   * ------------------------------------------------------------- */
  function buildMouth() {
    const segs = 8;
    const width = HEAD_R * HEAD_SX * 0.5;
    const baseY = -HEAD_R * HEAD_SY * 0.44;
    // Same front-surface projection as the eyes, evaluated at the mouth's
    // position, so it sits on the wireframe's actual surface instead of a
    // depth value left over from the old (narrower/taller) proportions.
    const mny = baseY / (HEAD_R * HEAD_SY);
    const baseZ = HEAD_R * HEAD_SZ * Math.sqrt(Math.max(0, 1 - mny * mny)) * 1.04;
    function makeLine() {
      const positions = new Float32Array((segs + 1) * 3);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      return geo;
    }
    const upperGeo = makeLine();
    const lowerGeo = makeLine();
    const mouthMat = new THREE.LineBasicMaterial({
      color: 0xdfffff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending,
    });
    const group = new THREE.Group();
    group.add(new THREE.Line(upperGeo, mouthMat), new THREE.Line(lowerGeo, mouthMat.clone()));
    return { group, upperGeo, lowerGeo, baseY, baseZ, width, segs };
  }
  const mouth = buildMouth();
  headWire.add(mouth.group);

  function updateMouth(level) {
    const open = level * 0.16;
    const upPos = mouth.upperGeo.attributes.position;
    const loPos = mouth.lowerGeo.attributes.position;
    for (let i = 0; i <= mouth.segs; i++) {
      const t = i / mouth.segs;
      const x = (t - 0.5) * mouth.width;
      const curve = Math.sin(t * Math.PI) * 0.02;
      upPos.setXYZ(i, x, mouth.baseY + curve + open, mouth.baseZ);
      loPos.setXYZ(i, x, mouth.baseY - curve - open, mouth.baseZ);
    }
    upPos.needsUpdate = true;
    loPos.needsUpdate = true;
  }
  updateMouth(0);

  const faceGroup = new THREE.Group();
  faceGroup.add(points, headWire);
  scene.add(faceGroup);

  /* ---------------------------------------------------------------
   * 2c. Orbiting rings with satellite dots (cyan + amber), echoing the
   *     "orbiting data nodes" ring motif around the head in the
   *     reference video — plain line loops + small spheres, no extra
   *     assets needed.
   * ------------------------------------------------------------- */
  function buildOrbitRing(radius, color, tiltX, tiltZ, satelliteCount, speed) {
    const segs = 96;
    const curvePoints = [];
    for (let i = 0; i <= segs; i++) {
      const a = (i / segs) * Math.PI * 2;
      curvePoints.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius * 0.32, 0));
    }
    const ringGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
    const ringMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending });
    const ringLine = new THREE.LineLoop(ringGeo, ringMat);

    const group = new THREE.Group();
    group.add(ringLine);
    group.rotation.x = tiltX;
    group.rotation.z = tiltZ;

    const satGeo = new THREE.SphereGeometry(0.045, 10, 10);
    const satMat = new THREE.MeshBasicMaterial({ color });
    const satellites = [];
    for (let s = 0; s < satelliteCount; s++) {
      const mesh = new THREE.Mesh(satGeo, satMat);
      const offset = (s / satelliteCount) * Math.PI * 2;
      mesh.position.set(Math.cos(offset) * radius, Math.sin(offset) * radius * 0.32, 0);
      group.add(mesh);
      satellites.push({ mesh, offset });
    }
    return { group, satellites, radius, speed };
  }
  const orbitRings = [
    buildOrbitRing(2.0, 0x6fd8e8, 0.25, 0.1, 2, 0.4),
    buildOrbitRing(2.25, 0xffb15c, -0.35, 0.5, 2, -0.3),
    buildOrbitRing(1.85, 0x6fd8e8, 0.6, -0.4, 1, 0.55),
  ];
  orbitRings.forEach((r) => scene.add(r.group));

  /* Thin wireframe ring beneath the head, like a scan plane. */
  const ringGeo = new THREE.RingGeometry(1.55, 1.58, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x6fd8e8, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2 - 0.15;
  ring.position.y = -2.05;
  scene.add(ring);

  /* ---------------------------------------------------------------
   * 3. Animation loop: slow auto-rotate, idle shader time, periodic
   *    glitch burst (visual only — no functional state here).
   * ------------------------------------------------------------- */
  const clock = new THREE.Clock();
  let glitchUntil = 0;
  let nextGlitchAt = 6 + Math.random() * 6;
  // Declared here (before animate() first runs) rather than down by the
  // face-tracking button code, since `let` bindings referenced inside
  // animate() would otherwise throw — animate() executes synchronously
  // on its first call, before later `let` statements in this same
  // function would have run.
  let faceTrackingActive = false;
  let targetYaw = 0;
  let targetPitch = 0;
  let lastFaceSeenAt = 0;
  // Bumped by pushActivityLine() below on brain.request/brain.response
  // events (real ones from Core, or the labeled demo feed) and decayed
  // every frame in animate() to brighten the brain visualization while
  // Jarvis is actually "thinking" instead of a fixed idle pulse.
  let brainPulse = 0;
  let nextBrainRewireAt = 0;
  const rgbSplit = document.getElementById("rgb-split");
  const banner = document.getElementById("glitch-banner");
  const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (REDUCED_MOTION) nextGlitchAt = Infinity; // no periodic glitch bursts at all

  function triggerGlitch() {
    const now = clock.getElapsedTime();
    glitchUntil = now + 0.5 + Math.random() * 0.4;
    rgbSplit.style.opacity = "0.5";
    rgbSplit.style.background =
      "linear-gradient(90deg, rgba(255,60,60,0.12), transparent 40%, rgba(60,200,255,0.12))";
    if (Math.random() < 0.5) {
      banner.style.transition = "none";
      banner.style.opacity = "1";
      setTimeout(() => {
        banner.style.transition = "opacity 0.6s ease";
        banner.style.opacity = "0";
      }, 550);
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    material.uniforms.uTime.value = t;

    if (t > nextGlitchAt) {
      triggerGlitch();
      nextGlitchAt = t + 7 + Math.random() * 8;
    }
    const inGlitch = t < glitchUntil;
    material.uniforms.uGlitch.value = inGlitch ? 1.0 : Math.max(0, material.uniforms.uGlitch.value - 0.08);
    if (!inGlitch) rgbSplit.style.opacity = String(Math.max(0, parseFloat(rgbSplit.style.opacity || "0") - 0.06));

    // Brain glow: a small idle breathing base, brightened by real (or
    // labeled-demo) brain.request/brain.response activity and decaying
    // back down — never a fixed animation pretending to be "thinking".
    brainPulse = Math.max(0, brainPulse - 0.012);
    const brainGlow = 0.55 + Math.sin(t * 1.3) * 0.1 + brainPulse * 0.45;
    brain.pointsMat.opacity = Math.min(1, brainGlow);
    brain.lineMat.opacity = Math.min(0.55, 0.15 + brainPulse * 0.4);

    // Continuous per-particle drift — "always thinking", not a structure
    // that only moves when a real event bumps brainPulse. Amplitude grows
    // a little further while brainPulse is high, so real activity still
    // reads as "moving more," but it's never fully static at rest.
    if (!REDUCED_MOTION) {
      const jitterAmp = 0.05 + brainPulse * 0.05;
      const bp = brain.posAttr.array;
      for (let i = 0; i < brain.n; i++) {
        const ph = brain.phases[i];
        bp[i * 3] = brain.basePositions[i * 3] + Math.sin(t * 0.9 + ph) * jitterAmp;
        bp[i * 3 + 1] = brain.basePositions[i * 3 + 1] + Math.cos(t * 0.7 + ph * 1.3) * jitterAmp;
        bp[i * 3 + 2] = brain.basePositions[i * 3 + 2] + Math.sin(t * 0.8 + ph * 0.6) * jitterAmp;
      }
      brain.posAttr.needsUpdate = true;

      // Re-wire a few synapse lines every ~1.1s so the connections
      // visibly re-form over time, like real firing, instead of a fixed
      // static network.
      if (t > nextBrainRewireAt) {
        for (let k = 0; k < 4; k++) brain.rewire(Math.floor(Math.random() * brain.lineEndpoints.length));
        nextBrainRewireAt = t + 1.1;
      }
      const lp = brain.lineGeo.attributes.position.array;
      for (let i = 0; i < brain.lineEndpoints.length; i++) {
        const [ia, ib] = brain.lineEndpoints[i];
        lp[i * 6] = bp[ia * 3]; lp[i * 6 + 1] = bp[ia * 3 + 1]; lp[i * 6 + 2] = bp[ia * 3 + 2];
        lp[i * 6 + 3] = bp[ib * 3]; lp[i * 6 + 4] = bp[ib * 3 + 1]; lp[i * 6 + 5] = bp[ib * 3 + 2];
      }
      brain.lineGeo.attributes.position.needsUpdate = true;
    }

    if (!REDUCED_MOTION) {
      // Face-tracking (webcam) overrides the idle drift while a real face
      // was seen recently — smoothly turns toward the tracked position
      // instead of the ambient sine-wave sway. Falls back to idle drift
      // the instant tracking is off or the face has been lost for >1.5s,
      // rather than freezing at the last tracked angle.
      if (faceTrackingActive && performance.now() - lastFaceSeenAt < 1500) {
        faceGroup.rotation.y += (targetYaw - faceGroup.rotation.y) * 0.08;
        faceGroup.rotation.x += (targetPitch - faceGroup.rotation.x) * 0.08;
        faceGroup.rotation.z += (0 - faceGroup.rotation.z) * 0.08;
      } else {
        faceGroup.rotation.y = Math.sin(t * 0.24) * 0.4;
        faceGroup.rotation.x = Math.sin(t * 0.15) * 0.07;
        faceGroup.rotation.z = Math.sin(t * 0.09) * 0.025;
      }
      // Subtle continuous "breathing" scale, a little stronger while the
      // brain is actively pulsing — reinforces that this is alive and
      // thinking, not a static prop, even when facing straight ahead.
      const breathe = 1 + Math.sin(t * 0.7) * 0.012 + brainPulse * 0.01;
      faceGroup.scale.setScalar(breathe);
      orbitRings.forEach((r) => {
        r.satellites.forEach((s) => {
          const a = t * r.speed + s.offset;
          s.mesh.position.set(Math.cos(a) * r.radius, Math.sin(a) * r.radius * 0.32, 0);
        });
      });
    }
    if (!REDUCED_MOTION) ring.rotation.z = t * 0.15;

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------------------------------------------------------------
   * 4. HUD telemetry panels. NEURAL SYNC / MEMORY LOAD / LATENCY have no
   *    real Core equivalent (Core exposes no CPU/process telemetry) and
   *    stay honestly cosmetic — jittering flavor, not measurements. TOOL
   *    REGISTRY and the device row ARE real: polled from GET /status
   *    below and start in an honest "no data yet" state rather than a
   *    fabricated-looking default, exactly like the bottom activity
   *    panel's DEMO/LIVE distinction.
   * ------------------------------------------------------------- */
  const leftLines = [
    ["NEURAL SYNC", "98.2%", 0.98],
    ["MEMORY LOAD", "64%", 0.64],
    ["TOOL REGISTRY", "—", 0],
    ["PERMISSION GATE", "NOMINAL", 0.9],
  ];
  const rightLines = [
    ["DEVICES", "—", 0],
    ["LATENCY", "18ms", 0.85],
    ["OBSERVERS", "—", 0],
    ["PROTOCOL", "v2", 0.7],
  ];

  function renderPanel(container, lines) {
    container.innerHTML = "";
    lines.forEach(([label, val, frac]) => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `${label}<span class="bar"><span style="transform:scaleX(${frac})"></span></span><span class="val">${val}</span>`;
      container.appendChild(row);
    });
    const cursorRow = document.createElement("div");
    cursorRow.className = "row";
    cursorRow.innerHTML = `&gt;<span id="cursor"></span>`;
    container.appendChild(cursorRow);
  }
  const panelLeftRows = document.getElementById("panel-left-rows");
  const panelRightRows = document.getElementById("panel-right-rows");
  renderPanel(panelLeftRows, leftLines);
  renderPanel(panelRightRows, rightLines);

  setInterval(() => {
    // subtle live-feeling jitter on the purely-cosmetic values only —
    // never on the real TOOL REGISTRY/DEVICES/OBSERVERS rows, which
    // pollStatus() below owns exclusively.
    leftLines[0][2] = Math.min(1, Math.max(0.7, leftLines[0][2] + (Math.random() - 0.5) * 0.03));
    leftLines[0][1] = (leftLines[0][2] * 100).toFixed(1) + "%";
    rightLines[1][1] = Math.round(12 + Math.random() * 14) + "ms";
    renderPanel(panelLeftRows, leftLines);
    renderPanel(panelRightRows, rightLines);
  }, 1800);

  /* ---------------------------------------------------------------
   * 4b. Real status poll — GET /status on Core every 1s (matching the
   *     cadence of the dashboard reference this was compared against).
   *     Updates the TOOL REGISTRY / DEVICES / OBSERVERS rows with real
   *     numbers and flips both panel headings to LIVE; on any failure
   *     (Core offline, unreachable) they honestly read "NO DATA" rather
   *     than silently keeping stale or fabricated-looking numbers.
   * ------------------------------------------------------------- */
  function corePort() { return new URLSearchParams(location.search).get("port") || "4770"; }
  function coreHost() { return new URLSearchParams(location.search).get("host") || "localhost"; }

  function setPanelStatus(isLive) {
    for (const id of ["status-indicator-left", "status-indicator-right"]) {
      const el = document.getElementById(id);
      el.textContent = isLive ? "LIVE" : "NO DATA";
      el.className = "status " + (isLive ? "live" : "demo");
    }
  }

  async function pollStatus() {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 900);
      const res = await fetch(`http://${coreHost()}:${corePort()}/status`, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) throw new Error(`status ${res.status}`);
      const data = await res.json();

      leftLines[2][1] = `${data.tools.length} REGISTERED`;
      leftLines[2][2] = Math.min(1, data.tools.length / 8);

      rightLines[0][1] = data.devices.total === 0 ? "NONE REGISTERED" : `${data.devices.online}/${data.devices.total} ONLINE`;
      rightLines[0][2] = data.devices.total === 0 ? 0 : data.devices.online / data.devices.total;
      rightLines[2][1] = `${data.observers} CONNECTED`;
      rightLines[2][2] = Math.min(1, data.observers / 3);

      setPanelStatus(true);
    } catch (e) {
      leftLines[2][1] = "—";
      leftLines[2][2] = 0;
      rightLines[0][1] = "—";
      rightLines[0][2] = 0;
      rightLines[2][1] = "—";
      rightLines[2][2] = 0;
      setPanelStatus(false);
    }
    renderPanel(panelLeftRows, leftLines);
    renderPanel(panelRightRows, rightLines);
  }
  pollStatus();
  setInterval(pollStatus, 1000);

  /* ---------------------------------------------------------------
   * 5. Live "behind the scenes" activity feed. Connects to JARVIS
   *    Core's real /observer WebSocket (broadcasts actual EventBus
   *    events: brain requests/responses, tool calls, permission
   *    checks, device connections) — never fabricated once connected.
   *    Falls back to a clearly-labeled DEMO feed only when Core isn't
   *    reachable, so nothing here is ever silently pretending to be real.
   * ------------------------------------------------------------- */
  const MAX_ACTIVITY_LINES = 7;
  const activityLinesEl = document.getElementById("activity-lines");
  const activityStatusEl = document.getElementById("activity-status");
  const activityQueue = [];

  function kindFor(type) {
    if (type.startsWith("tool.")) return "k-tool";
    if (type.startsWith("brain.")) return "k-brain";
    if (type.startsWith("permission.")) return "k-perm";
    if (type.startsWith("device.")) return "k-device";
    return "";
  }

  function describeEvent(type, payload) {
    switch (type) {
      case "brain.request": return `brain.request  messages=${payload.messageCount}`;
      case "brain.response": return `brain.response  tool_calls=${payload.toolCallCount}  "${String(payload.text || "").slice(0, 46)}"`;
      case "tool.requested": return `tool.requested  ${payload.toolCall && payload.toolCall.toolName}(${JSON.stringify(payload.toolCall && payload.toolCall.input || {}).slice(0, 40)})`;
      case "tool.executed": return `tool.executed  ${payload.toolName}  ok=${payload.result && payload.result.success}`;
      case "tool.dispatched": return `tool.dispatched  ${payload.toolName} -> device:${String(payload.deviceId).slice(0, 8)}`;
      case "permission.checked": return `permission.checked  ${payload.toolId}  allowed=${payload.result && payload.result.allowed}`;
      case "device.registered": return `device.registered  ${payload.device && payload.device.name}`;
      case "device.connected": return `device.connected  ${String(payload.deviceId).slice(0, 8)}`;
      case "device.disconnected": return `device.disconnected  ${String(payload.deviceId).slice(0, 8)}  (${payload.reason})`;
      default: return `${type}  ${JSON.stringify(payload).slice(0, 60)}`;
    }
  }

  function pushActivityLine(type, payload, timestamp) {
    const time = new Date(timestamp || Date.now()).toLocaleTimeString([], { hour12: false });
    activityQueue.push({ time, text: describeEvent(type, payload || {}), kind: kindFor(type) });
    if (activityQueue.length > MAX_ACTIVITY_LINES) activityQueue.shift();
    activityLinesEl.innerHTML = activityQueue
      .map((l) => `<div class="line"><span class="t">${l.time}</span>  <span class="${l.kind}">${l.text}</span></div>`)
      .join("");
    if (type === "brain.request" || type === "brain.response") brainPulse = 1;
  }

  function setActivityStatus(isLive) {
    activityStatusEl.textContent = isLive ? "LIVE · CONNECTED TO CORE" : "DEMO · CORE OFFLINE";
    activityStatusEl.className = "status " + (isLive ? "live" : "demo");
  }

  // Demo feed: only ever runs while there's no real Core connection, and
  // is honestly labeled as such in the panel header above.
  const DEMO_EVENTS = [
    ["brain.request", { messageCount: 3 }],
    ["tool.requested", { toolCall: { toolName: "getActiveApplication", input: {} } }],
    ["permission.checked", { toolId: "getActiveApplication", result: { allowed: true } }],
    ["tool.executed", { toolName: "getActiveApplication", result: { success: true } }],
    ["brain.response", { toolCallCount: 0, text: "You currently have Safari in the foreground." }],
    ["device.connected", { deviceId: "imac-primary-001" }],
  ];
  let demoTimer = null;
  function startDemoFeed() {
    if (demoTimer) return;
    let i = 0;
    demoTimer = setInterval(() => {
      const [type, payload] = DEMO_EVENTS[i % DEMO_EVENTS.length];
      pushActivityLine(type, payload, Date.now());
      i++;
    }, 2200);
  }
  function stopDemoFeed() {
    if (demoTimer) { clearInterval(demoTimer); demoTimer = null; }
  }

  function connectObserver() {
    let socket;
    try {
      socket = new WebSocket(`ws://${coreHost()}:${corePort()}/observer`);
    } catch (e) {
      setActivityStatus(false);
      startDemoFeed();
      return;
    }
    const connectTimeout = setTimeout(() => {
      if (socket.readyState !== WebSocket.OPEN) socket.close();
    }, 2500);

    socket.addEventListener("open", () => {
      clearTimeout(connectTimeout);
      stopDemoFeed();
      setActivityStatus(true);
      pushActivityLine("device.connected", { deviceId: "observer (this page)" }, Date.now());
    });
    socket.addEventListener("message", (ev) => {
      try {
        const msg = JSON.parse(ev.data);
        pushActivityLine(msg.type, msg.payload, msg.timestamp);
      } catch (e) { /* ignore malformed frames */ }
    });
    socket.addEventListener("close", () => {
      setActivityStatus(false);
      startDemoFeed();
      setTimeout(connectObserver, 5000); // keep trying — Core may start later
    });
    socket.addEventListener("error", () => socket.close());
  }

  setActivityStatus(false);
  startDemoFeed();
  connectObserver();

  /* ---------------------------------------------------------------
   * 6. Real voice reactivity via Web Audio. `window.JarvisHologram`
   *    exposes hooks to feed it any real audio source — a <audio>
   *    element playing Jarvis's TTS output once that exists, or the
   *    microphone for testing right now (Core has no TTS yet, so
   *    there is nothing genuine to auto-connect to today).
   * ------------------------------------------------------------- */
  let audioCtx = null;
  let analyser = null;
  let audioData = null;
  const voiceRing = document.getElementById("voice-ring");

  /* WhatsApp-voice-message-style bar meter — draws real analyser data
     only (a flat idle line at 0 while nothing is connected, never a
     fabricated waveform), scrolling like a live voice-note. */
  const voiceBarsCanvas = document.getElementById("voice-bars");
  const vbCtx = voiceBarsCanvas.getContext("2d");
  const VB_COUNT = 28;
  const vbHistory = new Array(VB_COUNT).fill(0);
  function resizeVoiceBars() {
    const rect = voiceBarsCanvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    voiceBarsCanvas.width = Math.max(1, rect.width * dpr);
    voiceBarsCanvas.height = Math.max(1, rect.height * dpr);
  }
  resizeVoiceBars();
  window.addEventListener("resize", resizeVoiceBars);

  function drawVoiceBars(currentLevel) {
    vbHistory.shift();
    vbHistory.push(currentLevel);
    const w = voiceBarsCanvas.width, h = voiceBarsCanvas.height;
    vbCtx.clearRect(0, 0, w, h);
    const barW = w / VB_COUNT;
    for (let i = 0; i < VB_COUNT; i++) {
      const level = vbHistory[i];
      const barH = Math.max(h * 0.08, level * h * 0.92);
      const x = i * barW;
      const y = (h - barH) / 2;
      vbCtx.fillStyle = analyser ? "rgba(139,255,208,0.9)" : "rgba(111,216,232,0.3)";
      const bw = barW * 0.56;
      if (vbCtx.roundRect) {
        vbCtx.beginPath();
        vbCtx.roundRect(x + barW * 0.22, y, bw, barH, Math.min(bw / 2, barH / 2));
        vbCtx.fill();
      } else {
        vbCtx.fillRect(x + barW * 0.22, y, bw, barH); // older engines without roundRect support
      }
    }
  }

  function ensureAudioGraph() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.75;
    audioData = new Uint8Array(analyser.frequencyBinCount);
  }

  function sampleAudioLevel() {
    if (!analyser) return 0;
    analyser.getByteFrequencyData(audioData);
    let sum = 0;
    for (let i = 0; i < audioData.length; i++) sum += audioData[i];
    return Math.min(1, (sum / audioData.length / 255) * 2.2);
  }

  (function audioLoop() {
    requestAnimationFrame(audioLoop);
    const level = sampleAudioLevel();
    material.uniforms.uAudio.value += (level - material.uniforms.uAudio.value) * 0.25;
    const glow = material.uniforms.uAudio.value;
    voiceRing.style.borderColor = `rgba(111,216,232,${(glow * 0.8).toFixed(2)})`;
    voiceRing.style.transform = `scale(${1 + glow * 0.15})`;
    voiceRing.style.boxShadow = glow > 0.05 ? `0 0 ${20 + glow * 60}px rgba(111,216,232,${glow * 0.5})` : "none";
    updateMouth(glow);
    drawVoiceBars(analyser ? level : 0);
  })();

  window.JarvisHologram = {
    /** Feed a live <audio> or <video> element (e.g. Jarvis's TTS playback) into the reactive visualizer. */
    connectAudioElement(mediaEl) {
      ensureAudioGraph();
      const source = audioCtx.createMediaElementSource(mediaEl);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
    },
    /** Feed a raw MediaStream (e.g. from getUserMedia or a WebRTC/TTS stream) into the reactive visualizer. */
    connectMediaStream(stream) {
      ensureAudioGraph();
      const source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
    },
  };

  const audioBtn = document.getElementById("audio-ctl");
  let micActive = false;
  audioBtn.addEventListener("click", async () => {
    if (micActive) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      window.JarvisHologram.connectMediaStream(stream);
      micActive = true;
      audioBtn.textContent = "🎙 MIC LIVE (voice-reactive)";
      audioBtn.classList.add("active");
    } catch (e) {
      audioBtn.textContent = "🎙 MIC DENIED";
    }
  });

  /* ---------------------------------------------------------------
   * 6. Webcam face tracking — real detection (face-api.js, vendored
   *    locally under ./facetrack/ same as three.min.js, no CDN
   *    dependency), not a fake "always look at center" animation. While
   *    a face is being seen, the head's rotation (section 3's animate()
   *    loop, above) turns toward the tracked position instead of its
   *    idle sine-wave sway, and falls back to idle the moment no face
   *    has been seen for >1.5s. Lazy-loaded only on click: the model +
   *    runtime is ~1.6MB, not worth loading for everyone who never
   *    touches the button.
   * ------------------------------------------------------------- */
  const faceCtl = document.getElementById("face-ctl");
  const faceCam = document.getElementById("face-cam");
  let faceApiReady = false;

  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error(`failed to load ${src}`));
      document.head.appendChild(s);
    });
  }

  async function detectLoop() {
    if (!faceTrackingActive) return;
    try {
      const result = await faceapi
        .detectSingleFace(faceCam, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 }))
        .withFaceLandmarks(true);
      if (result && faceCam.videoWidth) {
        const box = result.detection.box;
        const cx = (box.x + box.width / 2) / faceCam.videoWidth;
        const cy = (box.y + box.height / 2) / faceCam.videoHeight;
        // Raw (unmirrored) webcam stream: a face that moves to ITS OWN
        // right appears on the LEFT of the frame. Inverting X here makes
        // the head turn toward where the user actually is (mirror-style,
        // like maintaining eye contact) instead of away from them.
        const offsetX = (0.5 - cx) * 2; // -1..1
        const offsetY = (cy - 0.5) * 2; // -1..1
        targetYaw = Math.max(-0.55, Math.min(0.55, offsetX * 0.55));
        targetPitch = Math.max(-0.3, Math.min(0.3, offsetY * 0.3));
        lastFaceSeenAt = performance.now();
      }
    } catch (e) {
      // One bad detection frame shouldn't kill the whole loop.
    }
    setTimeout(detectLoop, 120);
  }

  faceCtl.addEventListener("click", async () => {
    if (faceTrackingActive) return;
    faceCtl.textContent = "👁 LOADING…";
    faceCtl.className = "loading";
    try {
      if (!faceApiReady) {
        if (location.protocol === "file:") {
          throw new Error(
            "Face tracking needs the page served over http(s) — fetch() " +
            "for the model files is blocked by the browser under file://" +
            "(see README: 'python3 -m http.server' from this folder)."
          );
        }
        await loadScriptOnce("./facetrack/face-api.min.js");
        // The bundled tfjs registers a 'wasm' backend at higher priority
        // than 'webgl', but no .wasm binary is vendored here (only the
        // detector/landmark weights) — forcing 'webgl' explicitly avoids
        // tfjs trying and failing to initialize the wasm backend first.
        await faceapi.tf.setBackend("webgl");
        await faceapi.tf.ready();
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri("./facetrack/weights"),
          faceapi.nets.faceLandmark68TinyNet.loadFromUri("./facetrack/weights"),
        ]);
        faceApiReady = true;
      }
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
      faceCam.srcObject = stream;
      await faceCam.play();
      faceTrackingActive = true;
      faceCtl.textContent = "👁 FACE TRACKING LIVE";
      faceCtl.className = "active";
      detectLoop();
    } catch (e) {
      console.error("[jarvis-hologram] face tracking failed to start:", e);
      faceCtl.textContent = location.protocol === "file:"
        ? "👁 NEEDS LOCAL SERVER (see README)"
        : "👁 CAMERA/MODEL FAILED";
      faceCtl.className = "";
    }
  });
})();
</script>
</body>
</html>
