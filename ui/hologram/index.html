<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JARVIS Core</title>
  <meta name="description" content="Live view of the JARVIS Core — real-time state, conversation, and activity." />
  <meta name="theme-color" content="#03050a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bg"></div>
  <canvas id="core-canvas"></canvas>

  <div class="app">
    <div class="topbar">
      <div class="brand">
        <span class="mark">JARVIS</span>
        <span id="connection-pill" class="status-pill offline"><span class="dot"></span><span id="connection-label">CONNECTING</span></span>
      </div>
      <div class="top-right">
        <span id="state-readout" class="state-readout">IDLE</span>
        <button id="speaker-toggle" class="icon-btn" title="Speak replies aloud" aria-pressed="false" aria-label="Toggle spoken replies">&#128266;</button>
        <button id="mobile-sheet-toggle" class="icon-btn mobile-sheet-toggle" title="System status" aria-label="Open system status">&#9776;</button>
      </div>
    </div>

    <section id="system-panel" class="panel">
      <div class="panel-header">
        <span>System</span>
        <span id="system-tag" class="tag">NO DATA</span>
      </div>
      <div class="system-body">
        <div>
          <div class="stat-group-title">Current task</div>
          <div id="task-line" class="task-line idle-task">Nothing in progress.</div>
        </div>

        <div>
          <div class="stat-group-title">Core</div>
          <div class="stat-row"><span>Devices online</span><span id="stat-devices" class="value unavailable">&mdash;</span></div>
          <div class="stat-row"><span>Tools registered</span><span id="stat-tools" class="value unavailable">&mdash;</span></div>
          <div class="stat-row"><span>Observers</span><span id="stat-observers" class="value unavailable">&mdash;</span></div>
        </div>

        <div>
          <div class="stat-group-title">Activity</div>
          <div id="activity-log" class="activity-log"></div>
        </div>
      </div>
    </section>

    <div class="sheet-backdrop hidden" id="sheet-backdrop"></div>

    <section id="transcript-panel" class="panel">
      <div class="panel-header">
        <span>Conversation</span>
        <span id="chat-tag" class="tag">OFFLINE</span>
      </div>
      <div id="transcript-body" class="transcript-body" role="log" aria-live="polite"></div>
      <form id="composer" class="composer">
        <button type="button" id="mic-btn" class="icon-btn" title="Enable voice mode" aria-pressed="false" aria-label="Enable voice mode (always listening)">&#127908;</button>
        <input id="chat-input" type="text" autocomplete="off" placeholder="Talk to JARVIS&hellip;" aria-label="Message" />
        <button type="submit" id="send-btn" class="icon-btn send" title="Send" aria-label="Send message">&#10148;</button>
      </form>
    </section>

    <div class="footer">
      <span id="footer-version">JARVIS Core</span>
      <span class="sep">&middot;</span>
      <span id="footer-status">offline</span>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="shaders/CopyShader.js"></script>
  <script src="shaders/LuminosityHighPassShader.js"></script>
  <script src="postprocessing/EffectComposer.js"></script>
  <script src="postprocessing/RenderPass.js"></script>
  <script src="postprocessing/ShaderPass.js"></script>
  <script src="postprocessing/UnrealBloomPass.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
